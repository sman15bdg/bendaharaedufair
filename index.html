<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembayaran &amp; Kwitansi – EcoPreneur TechFest 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ctext y='.9em' font-size='9'%3E🧾%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f8f2;--card:#fff;--tx:#17301c;--mu:#5d7262;--pr:#1f6b2f;--pr2:#e3f1e2;--bd:#d3e2d1;--wn:#b45309;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--card:#17251a;--tx:#e6f2e6;--mu:#9bb09f;--pr:#5ec16f;--pr2:#1d3322;--bd:#2c4430;--wn:#f0b45a;--er:#f08080}}
:root[data-theme="dark"]{--bg:#0f1a12;--card:#17251a;--tx:#e6f2e6;--mu:#9bb09f;--pr:#5ec16f;--pr2:#1d3322;--bd:#2c4430;--wn:#f0b45a;--er:#f08080}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}
header{display:flex;gap:10px;align-items:center;margin-bottom:10px}header img{height:46px}header h1{font-size:17px;margin:0;line-height:1.2}header small{color:var(--mu)}
.tabs{display:flex;gap:6px;margin:8px 0 12px}.tabs button{flex:1}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 12px;border-radius:10px;cursor:pointer}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.on{background:var(--pr2);border-color:var(--pr);font-weight:600}button.d{color:var(--er)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd)}.opt input{width:auto;margin-top:3px}.opt span{flex:1}.opt b{white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;background:var(--pr2);padding:12px;border-radius:10px;margin-top:10px}
.st{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}.s1{color:var(--wn)}.s2{color:var(--pr)}.s3{color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mu{color:var(--mu);font-size:13px}
.thumb{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--bd);cursor:zoom-in}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:9}.md>div{max-width:720px;margin:0 auto}
.sc{overflow-x:auto}
.kw{width:680px;background:#fff;color:#14301a;border:3px double #1f6b2f;padding:18px;position:relative;font-family:Georgia,serif;font-size:13px;line-height:1.4;overflow:hidden}
.kw .h{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1f6b2f;padding-bottom:8px}.kw .h img{height:56px}.kw .h div{flex:1;text-align:center}
.kw h2{margin:0;letter-spacing:4px;font-size:22px;color:#1f6b2f}.kw table{width:100%;border-collapse:collapse;margin:4px 0}.kw td,.kw th{padding:3px 5px;vertical-align:top}
.kw .it td,.kw .it th{border-bottom:1px solid #cfe0cd}.kw .r{text-align:right;white-space:nowrap}
.kw .tb{background:#eef6ec;border:1px solid #1f6b2f;padding:6px 10px;font-style:italic;margin:6px 0}
.kw .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;position:relative}
.kw .sg{text-align:center;width:230px;position:relative;min-height:130px}.kw .sg .stm{position:absolute;left:-10px;top:14px;width:120px;opacity:.85;transform:rotate(-12deg);mix-blend-mode:multiply}
.kw .sg .nm{position:absolute;bottom:0;left:0;right:0;border-top:1px solid #14301a;font-weight:bold;padding-top:2px}
.kw .mk{position:absolute;left:8px;bottom:6px;height:120px}.kw .lunas{position:absolute;right:30px;top:100px;color:#1f6b2f;opacity:.12;font-size:70px;font-weight:bold;transform:rotate(-18deg);pointer-events:none}
.kw .tt{font-size:20px;font-weight:bold;background:#1f6b2f;color:#fff;padding:6px 16px;display:inline-block;margin-left:130px}
</style></head><body><div class="w">

function draw(){const v=document.getElementById('v');if(!CAT&&cur!==3)return v.innerHTML='<div class="c">Memuat...</div>';if(cur===1)v.innerHTML=formH();else if(cur===2)v.innerHTML=statH();else v.innerHTML=auth?benH():`<div class="c"><b>Masuk Bendahara</b><label>PIN</label><input id="pin" type="password" inputmode="numeric"><div class="row"><button class="p" onclick="login()">Masuk</button></div></div>`}

 else if(j==='tenant'||j==='sponsor')o+=c.one.map((x,i)=>op('radio',j,i,x)).join('')+(j==='sponsor'?'<div class="mu">Harga belum termasuk PPN.</div>':'');
 else if(j==='kerja')o+=c.grp.map(g=>`<div class="mu" style="margin-top:10px"><b>${g[0]}</b></div>`+g[1].map((x,i)=>op('checkbox',j,g[0]+i,x)).join('')).join('');
 else o+=`<label>Keperluan pembayaran</label><input id="lk" value="${E(S.ln.k)}" oninput="S.ln.k=this.value;tt()"><label>Nominal (Rp)</label><input id="lp" type="number" inputmode="numeric" value="${E(S.ln.p)}" oninput="S.ln.p=this.value;tt()">`;
 return `<div class="c"><b>1. Jenis pembayaran</b><div class="chips" style="margin-top:8px">${Object.keys(CAT).map(k=>`<button class="${k===j?'on':''}" onclick="S.jenis='${k}';S.sel={};draw()">${CAT[k].l}</button>`).join('')}</div></div>
<div class="c"><b>2. Data pembayar</b><label>Nama / Instansi</label><input id="in" value="${E(LS.in||'')}"><label>Nama penanggung jawab</label><input id="nm" value="${E(LS.nm||'')}"><label>Nomor WhatsApp (untuk kirim kwitansi)</label><input id="wa" inputmode="tel" placeholder="08xxxxxxxxxx" value="${E(LS.wa||'')}"></div>
<div class="c"><b>3. Pilihan &amp; jumlah yang harus dibayar</b>${o}<div class="tot"><span>Total</span><span id="tt">${R(tot(items()))}</span></div></div>
<div class="c"><b>4. Bukti transfer</b><div class="mu">Transfer sesuai total ke rekening panitia (info dari bendahara), lalu unggah buktinya.</div><input id="bk" type="file" accept="image/*" style="margin-top:8px"><div class="row"><button class="p" id="sb" onclick="submit()">Kirim Pembayaran</button></div><div id="msg" class="mu"></div></div>`}
function op(t,j,i,x){const k=j+i,on=!!S.sel[k];return `<label class="opt" style="color:var(--tx);font-size:15px;margin:0"><input type="${t}" name="${j}" ${on?'checked':''} onchange="pick('${t}','${j}','${String(i).replace(/'/g,"\\'")}',this.checked)"><span>${x[0]}</span><b>${R(x[1])}</b></label>`}
function pick(t,j,i,ch){if(t==='radio'){Object.keys(S.sel).forEach(k=>delete S.sel[k]);S.sel[j+i]=1}else S.sel[j+i]=ch;keep();tt()}
function keep(){['in','nm','wa'].forEach(i=>{const e=document.getElementById(i);if(e)LS[i]=e.value})}
function tt(){const e=document.getElementById('tt');if(e)e.textContent=R(tot(items()))}
function numWA(s){s=String(s).replace(/\D/g,'');if(s.startsWith('0'))s='62'+s.slice(1);return s}
function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
async function submit(){keep();const it=items(),m=document.getElementById('msg'),f=document.getElementById('bk').files[0];
 if(!LS.in||!LS.nm||numWA(LS.wa).length<9)return m.textContent='Lengkapi nama instansi, penanggung jawab, dan nomor WA.';
 if(!it.length)return m.textContent='Pilih item pembayaran terlebih dahulu.';if(!f)return m.textContent='Unggah bukti transfer.';
 document.getElementById('sb').disabled=true;m.textContent='Mengirim...';
 try{const b=await shrink(f),r=await api('submit',{jenis:S.jenis,instansi:LS.in,nama:LS.nm,wa:numWA(LS.wa),items:it,bukti:b}),id=r.id;
 S={jenis:'edu',sel:{},ln:{k:'',p:''}};LS={};cur=2;[1,2,3].forEach(i=>document.getElementById('t'+i).className=i==2?'on':'');document.getElementById('v').innerHTML=`<div class="c"><b>Pembayaran terkirim ✔</b><p>Kode pengajuan Anda:</p><h2 style="margin:0">${id}</h2><p class="mu">Simpan kode ini. Setelah diverifikasi bendahara, kwitansi digital dikirim ke WhatsApp Anda dan juga bisa dilihat di tab Cek Status.</p></div>`+statH()}
 catch(e){m.textContent='Gagal mengirim: '+e.message;document.getElementById('sb').disabled=false}}
function statH(){return `<div class="c"><b>Cek status pembayaran</b><label>Kode pengajuan</label><input id="kd" style="text-transform:uppercase"><div class="row"><button class="p" onclick="cek()">Cek</button></div><div id="hs"></div></div>`}
async function cek(){const id=document.getElementById('kd').value.trim().toUpperCase(),h=document.getElementById('hs');h.innerHTML='<p class="mu">Memeriksa...</p>';
 try{const d=(await api('status',{id})).d;PD=d;
 h.innerHTML=`<p>${E(d.instansi)} · ${R(d.total)} · ${stH(d)}</p>`+(d.status==='terverifikasi'?`<button class="p" onclick="showKw('${d.id}')">Lihat Kwitansi</button>`:d.status==='ditolak'?`<p class="mu">Alasan: ${E(d.alasan)}</p>`:'')}catch(e){h.innerHTML='<p class="mu">Kode tidak ditemukan.</p>'}}
const stH=d=>d.status==='terverifikasi'?'<span class="st s2">Terverifikasi</span>':d.status==='ditolak'?'<span class="st s3">Ditolak</span>':'<span class="st s1">Menunggu verifikasi</span>';
async function loadList(){try{docs=(await api('admin_list',{pin:PINV})).list;draw()}catch(e){alert(e.message)}}
async function login(){PINV=document.getElementById('pin').value;try{docs=(await api('admin_list',{pin:PINV})).list;auth=true;draw()}catch(e){PINV='';alert(e.message)}}
function benH(){const L=docs.filter(d=>d.status===flt).sort((a,b)=>b.dibuat-a.dibuat),n=s=>docs.filter(d=>d.status===s).length;
 return `<div class="chips">${['menunggu','terverifikasi','ditolak'].map(s=>`<button class="${s===flt?'on':''}" onclick="flt='${s}';draw()">${s[0].toUpperCase()+s.slice(1)} (${n(s)})</button>`).join('')}</div><div class="row"><button onclick="loadList()">↻ Muat ulang</button></div>`+
 (L.map(d=>`<div class="c"><b>${E(d.instansi)}</b> ${stH(d)}<div class="mu">${E(d.jenis)} · PJ: ${E(d.nama)} · WA ${E(d.wa)}<br>Kode ${d.id}${d.noKw?' · '+d.noKw:''}</div><ul style="margin:6px 0;padding-left:18px">${d.items.map(x=>`<li>${E(x.n)} — ${R(x.p)}</li>`).join('')}</ul><b>Total ${R(d.total)}</b><div class="row"><button onclick="zoom('${d.id}')">Lihat bukti transfer</button></div><div class="row">`+
 (d.status==='menunggu'?`<button class="p" onclick="ver('${d.id}')">Verifikasi</button><button class="d" onclick="tolak('${d.id}')">Tolak</button>`:d.status==='terverifikasi'?`<button class="p" onclick="showKw('${d.id}')">Kwitansi / Kirim WA</button>`:`<span class="mu">${E(d.alasan)}</span>`)+`</div></div>`).join('')||'<p class="mu">Tidak ada data.</p>')}
const g=id=>docs.find(d=>d.id===id);
async function zoom(id){mod('<div class="c">Memuat bukti...</div>');try{const r=await api('admin_bukti',{pin:PINV,id});mod(`<div class="c"><img src="${r.img}" style="max-width:100%"><div class="row"><button onclick="mod()">Tutup</button></div></div>`)}catch(e){mod();alert(e.message)}}
function mod(h){const m=document.getElementById('m');m.hidden=!h;m.innerHTML=h?`<div>${h}</div>`:''}
async function ver(id){const d=g(id);if(!confirm('Verifikasi pembayaran '+d.instansi+' sebesar '+R(d.total)+'?'))return;
 try{const r=await api('admin_verify',{pin:PINV,id});Object.assign(d,r.d);draw();showKw(id)}catch(e){alert(e.message)}}
async function tolak(id){const a=prompt('Alasan penolakan (mis. nominal tidak sesuai):');if(!a)return;try{const r=await api('admin_reject',{pin:PINV,id,alasan:a});Object.assign(g(id),r.d);draw()}catch(e){alert(e.message)}}
function terb(n){const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'],t=tb=>terb(tb);
 if(n<12)return s[n];if(n<20)return t(n-10)+' belas';if(n<100)return t(Math.floor(n/10))+' puluh'+(n%10?' '+t(n%10):'');if(n<200)return 'seratus'+(n%100?' '+t(n%100):'');if(n<1e3)return t(Math.floor(n/100))+' ratus'+(n%100?' '+t(n%100):'');if(n<2e3)return 'seribu'+(n%1e3?' '+t(n%1e3):'');if(n<1e6)return t(Math.floor(n/1e3))+' ribu'+(n%1e3?' '+t(n%1e3):'');if(n<1e9)return t(Math.floor(n/1e6))+' juta'+(n%1e6?' '+t(n%1e6):'');return t(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+t(n%1e9):'')}
const tgl=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
function kwH(d){return `<div class="kw"><div class="lunas">LUNAS</div><div class="h"><img src="${LOGO}"><div><h2>KWITANSI</h2><b>ECOPRENEUR TECHFEST 2026</b><br>Penyelenggara: SMAN 15 Bandung</div><div style="text-align:right;font-size:12px">No.<br><b>${E(d.noKw)}</b></div></div>
<table style="margin-top:8px"><tr><td style="width:150px">Telah terima dari</td><td>: <b>${E(d.instansi)}</b> (PJ: ${E(d.nama)})</td></tr><tr><td>Jenis pembayaran</td><td>: ${E(d.jenis)}</td></tr></table>
<div class="tb">Terbilang: ${terb(d.total)} rupiah</div>
<table class="it"><tr><th align="left">Untuk pembayaran</th><th class="r">Jumlah</th></tr>${d.items.map(x=>`<tr><td>${E(x.n)}</td><td class="r">${R(x.p)}</td></tr>`).join('')}<tr><th align="left">Total</th><th class="r">${R(d.total)}</th></tr></table>
<div class="ft"><div style="flex:1"><span class="tt">${R(d.total)}</span></div><div class="sg">Bandung, ${tgl(d.tglVerif)}<br>Bendahara<img class="stm" src="${STEMPEL}"><div class="nm">${BEND}</div></div></div><img class="mk" src="${MASKOT}"></div>`}
function waTxt(d){return `Halo ${d.nama} (${d.instansi}),\nPembayaran Anda untuk EcoPreneur TechFest 2026 (SMAN 15 Bandung) telah TERVERIFIKASI.\n\nKWITANSI DIGITAL\nNo: ${d.noKw}\nTanggal: ${tgl(d.tglVerif)}\nJenis: ${d.jenis}\n`+d.items.map((x,i)=>`${i+1}. ${x.n} - ${R(x.p)}`).join('\n')+`\nTOTAL: ${R(d.total)} (${terb(d.total)} rupiah)\n\nBendahara: ${BEND}\nTerima kasih atas partisipasinya!`}
function showKw(id){const d=g(id)||PD;if(!d)return;mod(`<div class="c"><div class="sc">${kwH(d)}</div><div class="row">${auth&&d.wa?`<a class="btn p" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${d.wa}?text=${encodeURIComponent(waTxt(d))}">Kirim ke WA</a>`:''}<button onclick="unduh('${d.id}')">Unduh</button><button onclick="mod()">Tutup</button></div></div>`)}
function unduh(id){const d=g(id)||PD,css=document.querySelector('style').textContent.match(/\.kw[^]*$/)[0],h=`<!doctype html><meta charset=utf-8><title>${E(d.noKw)}</title><style>body{margin:20px;background:#eee}${css}</style>${kwH(d)}`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='Kwitansi-'+d.noKw.replace(/\//g,'-')+'.html';document.body.appendChild(a);a.click();a.remove()}
init();
</script></body></html>
